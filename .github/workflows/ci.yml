name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check bash syntax
        run: bash -n setup-skills/scripts/install.sh setup-skills/scripts/write-commands.sh

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck setup-skills/scripts/*.sh

      - name: Validate skill metadata
        run: python3 scripts/validate.py

      - name: Test the validator
        run: python3 scripts/test_validate.py

      - name: Dry-run install (parse + optional logic, no network)
        run: bash setup-skills/scripts/install.sh --agents opencode --dry-run