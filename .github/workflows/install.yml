name: Install smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Install skills
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash setup-skills/scripts/install.sh --agents opencode --include-optional

      - name: Verify installed skills
        run: |
          python3 - <<'PY'
          import subprocess, sys
          from pathlib import Path

          # Consume the installer's own plan instead of re-parsing the inventory.
          plan = subprocess.run(
              ["bash", "setup-skills/scripts/install.sh", "--agents", "opencode",
               "--include-optional", "--dry-run"],
              capture_output=True, text=True, check=True,
          ).stdout
          planned = [
              line.split()[1]
              for line in plan.splitlines()
              if line.startswith("[plan]")
          ]
          missing = [
              s for s in planned
              if not Path.home().joinpath(".agents", "skills", s, "SKILL.md").exists()
          ]
          if missing:
              print("missing installed skills:", ", ".join(missing))
              sys.exit(1)
          print(f"all {len(planned)} planned skills installed")
          PY